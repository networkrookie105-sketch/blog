version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: rookie-mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: rookieblog
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 容器首次初始化时自动执行建表脚本
      - ./rookie-blog/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./rookie-blog
    container_name: rookie-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: "jdbc:p6spy:mysql://mysql:3306/rookieblog?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      # 生产务必替换为强随机密钥
      JWT_SECRET: "change-me-to-a-strong-random-secret"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

  frontend:
    build: ./rookie-blog-vue3
    container_name: rookie-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
