spring:
  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: ${DB_URL:jdbc:p6spy:mysql://127.0.0.1:3306/rookieblog?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: Rookieblog-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  security:
    user:
      name: ${ADMIN_USERNAME:admin} # 登录用户名
      password: ${ADMIN_PASSWORD:123456} # 登录密码

#=================================================================
# minio
#=================================================================
minio:
  endpoint: ${MINIO_ENDPOINT:http://47.116.175.94:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:admin123456}
  bucketName: ${MINIO_BUCKET:rookieblog}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
